{% extends "base.html" %}
{% block title %}Profile | Gameplan Apparel{% endblock %}
{% block content %}
<section class="page-banner"><div class="page-wrap"><p class="eyebrow">ACCOUNT SETTINGS</p><h1>YOUR DETAILS.</h1><p>Keep your account information up to date.</p></div></section>
<section class="auth-wrap profile-wrap"><form class="form-panel" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h1>Profile details</h1>
  <label for="name">Full name</label><input id="name" name="name" required maxlength="100" value="{{ profile_user.name }}">
  <label for="email">Email address</label><input id="email" name="email" type="email" required maxlength="254" value="{{ profile_user.email }}">
  <hr class="form-divider">
  <p class="muted">Leave the password fields blank to keep your current password.</p>
  <label for="current_password">Current password<input id="current_password" name="current_password" type="password" autocomplete="current-password"></label>
  <label for="new_password">New password<input id="new_password" name="new_password" type="password" minlength="10" autocomplete="new-password"></label>
  <button class="button button-light button-full" type="submit">Save changes</button>
  <a class="button button-outline button-small" href="{{ url_for('dashboard') }}">← Back to My Account</a>
</form></section>
{% endblock %}
